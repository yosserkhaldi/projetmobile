openapi: 3.1.0
info:
  title: Mon Constat Digital API
  version: 0.2.0
  description: |
    Contrat d'API partagé par les 5 modules. Chaque module documente ici ses endpoints.

    **Authentification.** Les routes marquées d'un cadenas attendent
    `Authorization: Bearer <accessToken>`. Le jeton d'accès vaut 15 minutes ;
    `POST /auth/refresh` en donne un nouveau. La session expire après 30 minutes
    sans rafraîchissement.

    **Appareil.** L'application envoie `X-Device-Id` (identifiant aléatoire gardé sur le
    téléphone) et `X-Device-Name` (modèle). Ils servent à la liste des appareils et aux
    alertes de connexion depuis un nouvel appareil.

    **Erreurs.** Toutes les erreurs ont la forme `{ "error": { "code", "message" } }`.
    Le message est en français et peut être affiché tel quel.
servers:
  - url: http://localhost:3000/api
tags:
  - name: Authentification
    description: Module 1 — inscription, connexion, OTP, mot de passe, biométrie
  - name: Profil
    description: Module 1 — profil, permis, photos
  - name: Administration
    description: Module 1 — comptes et rôles (administrateur)
  - name: Compagnies
    description: Module 1 — compagnies d'assurance et agences
  - name: Sécurité
    description: Module 1 — appareils connectés et historique des connexions
  - name: Identité
    description: Module 1 — vérification de la CIN par un administrateur
  - name: Données personnelles
    description: Module 1 — loi n° 2004-63 (export, suppression du compte)
  - name: Constats
    description: Module 4 — constat amiable numérique scellé, empreinte SHA-256, PDF

paths:
  /health:
    get:
      summary: État de l'API
      security: []
      responses:
        '200':
          description: API disponible
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }

  /auth/register:
    post:
      tags: [Authentification]
      summary: Créer un compte conducteur
      description: Le rôle est toujours DRIVER. Un code OTP part par SMS.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterInput' }
      responses:
        '201': { $ref: '#/components/responses/Session' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Error' }

  /auth/login:
    post:
      tags: [Authentification]
      summary: Se connecter par e-mail ou téléphone
      description: Compte bloqué 15 minutes après 5 échecs consécutifs (423).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier:
                  type: string
                  description: E-mail, ou téléphone (8 chiffres = numéro tunisien)
                  examples: [sami@example.com, '20123456']
                password: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Session' }
        '401': { $ref: '#/components/responses/Error' }
        '403':
          description: Compte suspendu (ACCOUNT_SUSPENDED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '423':
          description: Compte bloqué (ACCOUNT_LOCKED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/refresh:
    post:
      tags: [Authentification]
      summary: Renouveler la session
      description: |
        Le jeton de rafraîchissement est remplacé à chaque appel. Un ancien jeton
        présenté une seconde fois ferme toutes les sessions du compte.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshInput' }
      responses:
        '200': { $ref: '#/components/responses/Session' }
        '401': { $ref: '#/components/responses/Error' }

  /auth/logout:
    post:
      tags: [Authentification]
      summary: Se déconnecter
      description: Révoque le jeton de rafraîchissement. La connexion biométrique reste active.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshInput' }
      responses:
        '204': { description: Déconnecté }

  /auth/phone/send:
    post:
      tags: [Authentification]
      summary: Renvoyer le code OTP par SMS
      responses:
        '204': { description: Code envoyé }
        '409': { $ref: '#/components/responses/Error' }
        '429':
          description: Un code a été envoyé il y a moins d'une minute
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/phone/verify:
    post:
      tags: [Authentification]
      summary: Vérifier le téléphone
      description: Code valable 10 minutes, 5 essais au plus.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CodeInput' }
      responses:
        '200': { $ref: '#/components/responses/UserResponse' }
        '400': { $ref: '#/components/responses/Error' }

  /auth/password/forgot:
    post:
      tags: [Authentification]
      summary: Recevoir un code de réinitialisation par e-mail
      description: Répond 204 que l'e-mail existe ou non.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '204': { description: Demande prise en compte }

  /auth/password/reset:
    post:
      tags: [Authentification]
      summary: Choisir un nouveau mot de passe
      description: Ferme toutes les sessions et désactive la connexion biométrique.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code, password]
              properties:
                email: { type: string, format: email }
                code: { type: string, pattern: '^\d{6}$' }
                password: { type: string, minLength: 8 }
      responses:
        '204': { description: Mot de passe modifié }
        '400': { $ref: '#/components/responses/Error' }

  /auth/biometric:
    post:
      tags: [Authentification]
      summary: Activer la connexion biométrique sur cet appareil
      description: |
        Renvoie une clé valable 30 jours, à garder dans le stockage sécurisé du
        téléphone et à n'utiliser qu'après une empreinte ou une reconnaissance faciale.
      responses:
        '201':
          description: Clé de l'appareil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceKey' }
    delete:
      tags: [Authentification]
      summary: Désactiver la connexion biométrique
      description: Avec `deviceToken`, sur cet appareil seulement ; sans, sur tous les appareils.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceToken: { type: string }
      responses:
        '204': { description: Désactivée }

  /auth/biometric/login:
    post:
      tags: [Authentification]
      summary: Se connecter avec la clé biométrique
      description: Ouvre une session et remplace la clé de l'appareil.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceToken]
              properties:
                deviceToken: { type: string }
      responses:
        '200':
          description: Session et nouvelle clé
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Session'
                  - $ref: '#/components/schemas/DeviceKey'
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /users/me:
    get:
      tags: [Profil]
      summary: Mon profil
      responses:
        '200': { $ref: '#/components/responses/UserResponse' }
        '401': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Profil]
      summary: Modifier mon profil et mon permis
      description: |
        L'e-mail et le rôle ne sont pas modifiables ici. Un nouveau téléphone doit
        être revérifié. Une chaîne vide efface un champ du permis.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileInput' }
      responses:
        '200': { $ref: '#/components/responses/UserResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Données personnelles]
      summary: Supprimer mon compte
      description: |
        Le compte est anonymisé (nom, e-mail, téléphone, permis, CIN, photos effacés)
        pour que les accidents et sinistres des autres modules restent cohérents.
        Refusé pour un administrateur.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        '204': { description: Compte supprimé }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /users/me/photo:
    put:
      tags: [Profil]
      summary: Envoyer ma photo de profil
      requestBody: { $ref: '#/components/requestBodies/Image' }
      responses:
        '200': { $ref: '#/components/responses/UserResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Profil]
      summary: Supprimer ma photo de profil
      responses:
        '200': { $ref: '#/components/responses/UserResponse' }

  /users/me/license-photo:
    put:
      tags: [Profil]
      summary: Envoyer la photo de mon permis
      requestBody: { $ref: '#/components/requestBodies/Image' }
      responses:
        '200': { $ref: '#/components/responses/UserResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Profil]
      summary: Supprimer la photo de mon permis
      responses:
        '200': { $ref: '#/components/responses/UserResponse' }

  /users/{id}/photo:
    get:
      tags: [Profil]
      summary: Photo de profil d'un utilisateur
      description: Le titulaire et les administrateurs seulement.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Image' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /users/{id}/license-photo:
    get:
      tags: [Profil]
      summary: Photo du permis d'un utilisateur
      description: Le titulaire et les administrateurs seulement.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Image' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /users/me/export:
    get:
      tags: [Données personnelles]
      summary: Télécharger mes données (JSON)
      description: Profil, consentement, appareils et connexions. Aucun secret (mot de passe, jetons).
      responses:
        '200':
          description: Export complet
          content:
            application/json:
              schema: { type: object }

  /users/stats:
    get:
      tags: [Administration]
      summary: Statistiques des comptes
      description: Comptes par rôle, identités par état, connexions sur 7 jours, inscriptions par jour.
      parameters:
        - { name: days, in: query, schema: { type: integer, minimum: 7, maximum: 90, default: 30 } }
      responses:
        '200':
          description: Statistiques
          content:
            application/json:
              schema: { type: object }
        '403': { $ref: '#/components/responses/Error' }

  /users/me/sessions:
    get:
      tags: [Sécurité]
      summary: Appareils connectés
      description: Sessions encore valables. `current` marque l'appareil qui fait la requête.
      responses:
        '200':
          description: Appareils
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/DeviceSession' }

  /users/me/sessions/{sessionId}:
    delete:
      tags: [Sécurité]
      summary: Déconnecter un appareil
      description: Son jeton d'accès est refusé tout de suite, même s'il n'a pas expiré.
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Déconnecté }
        '404': { $ref: '#/components/responses/Error' }

  /users/me/sessions/revoke-others:
    post:
      tags: [Sécurité]
      summary: Déconnecter tous les autres appareils
      responses:
        '200':
          description: Nombre d'appareils déconnectés
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked: { type: integer }

  /users/me/login-events:
    get:
      tags: [Sécurité]
      summary: Historique des 30 dernières connexions
      responses:
        '200':
          description: Connexions
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/LoginEvent' }

  /users/me/identity/{side}:
    put:
      tags: [Identité]
      summary: Envoyer le recto ou le verso de la pièce (CIN, permis, passeport)
      description: >-
        Recto : doit montrer un visage (422 NO_FACE_ON_DOCUMENT sinon), puis
        l'IA le lit (OCR) selon `documentType` : numéro, et pour la CIN nom,
        prénom, filiation et naissance en arabe, pour le passeport la MRZ.
        Le résultat est dans `identity.extracted`. Verso : refusé s'il montre
        un visage (422 BACK_HAS_FACE, c'est un recto). Pour un passeport, le
        recto est la page photo. Refusé (409 IDENTITY_LOCKED) pendant la
        vérification ou une fois vérifiée.
      parameters: [{ $ref: '#/components/parameters/Side' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo: { type: string, format: binary }
                documentType: { type: string, enum: [CIN, LICENSE, PASSPORT], default: CIN }
      responses:
        '200': { $ref: '#/components/responses/UserResponse' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /users/me/identity/front/from-license:
    post:
      tags: [Identité]
      summary: Utiliser la photo du permis du profil comme recto
      description: >-
        Sans nouvelle prise de vue : la photo du permis enregistrée dans le
        profil est copiée, vérifiée (visage) et lue par l'IA.
      responses:
        '200': { $ref: '#/components/responses/UserResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /users/me/identity/liveness:
    post:
      tags: [Identité]
      summary: Démarrer la vérification du visage (défi)
      description: >-
        Exige l'accord explicite pour l'analyse du visage (`consent: true`,
        loi n° 2004-63), enregistré avec sa date. Renvoie l'ordre des
        consignes, tiré au hasard (de face, puis gauche et droite dans un
        ordre aléatoire), et un jeton valable 5 minutes. Les routes d'analyse
        par l'IA sont limitées à 30 appels par heure et par compte
        (429 AI_QUOTA_EXCEEDED, en-tête Retry-After).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [consent]
              properties:
                consent: { type: boolean, enum: [true] }
      responses:
        '200':
          description: Défi
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  steps:
                    type: array
                    items: { type: string, enum: [center, left, right] }
        '409': { $ref: '#/components/responses/Error' }

  /users/me/identity/selfie:
    post:
      tags: [Identité]
      summary: Envoyer les photos du défi (une par consigne)
      description: >-
        L'IA vérifie un seul visage par photo, la tête de face puis tournée des
        deux côtés, et la même personne sur les trois photos. Seule la photo de
        face est gardée, jusqu'à la décision. Erreurs 422 LIVENESS_NO_FACE,
        LIVENESS_MANY_FACES, LIVENESS_NOT_CENTERED, LIVENESS_NO_TURN,
        LIVENESS_DIFFERENT_FACES, LIVENESS_EXPIRED.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [token, frames]
              properties:
                token: { type: string }
                frames:
                  type: array
                  description: Dans l'ordre des consignes du défi
                  items: { type: string, format: binary }
      responses:
        '200': { $ref: '#/components/responses/UserResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /users/me/identity/submit:
    post:
      tags: [Identité]
      summary: Demander la vérification d'identité
      description: >-
        Pièce (recto et verso, ou page photo du passeport) et vérification du
        visage de moins de 30 minutes requises. L'IA compare le visage à la
        photo de la pièce : ressemblance d'au moins 0,6, l'identité est
        validée tout de suite (VERIFIED, autoVerified) et la photo du visage
        effacée ; sinon la demande passe à PENDING pour un administrateur.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [number]
              properties:
                documentType: { type: string, enum: [CIN, LICENSE, PASSPORT], default: CIN }
                number:
                  type: string
                  description: CIN 8 chiffres, permis 12/345678, passeport X1234567
      responses:
        '200': { $ref: '#/components/responses/UserResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /users/{id}/identity/{side}:
    get:
      tags: [Identité]
      summary: Photo de la pièce ou du visage
      description: Le titulaire et les administrateurs seulement.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - name: side
          in: path
          required: true
          schema: { type: string, enum: [front, back, selfie] }
      responses:
        '200': { $ref: '#/components/responses/Image' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /users/identity/pending:
    get:
      tags: [Identité]
      summary: Demandes à vérifier (administrateurs)
      description: Les plus anciennes d'abord.
      responses:
        '200':
          description: Comptes en attente
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Error' }

  /users/{id}/identity/approve:
    post:
      tags: [Identité]
      summary: Valider une identité
      description: >-
        Le titulaire est prévenu sur WhatsApp et par e-mail. La photo du visage
        est effacée après la décision.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/UserResponse' }
        '409': { $ref: '#/components/responses/Error' }

  /users/{id}/identity/reject:
    post:
      tags: [Identité]
      summary: Refuser une identité avec un motif
      description: >-
        Les photos de la pièce et du visage sont effacées. Le titulaire attend
        24 h avant une nouvelle demande (429 IDENTITY_RETRY_LATER). Au 3e
        refus, ou si `severe` (fraude probable), la vérification est bloquée
        (403 IDENTITY_BLOCKED) jusqu'au déblocage par un administrateur.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 300 }
                severe: { type: boolean, default: false }
      responses:
        '200': { $ref: '#/components/responses/UserResponse' }
        '409': { $ref: '#/components/responses/Error' }

  /users/{id}/identity/unblock:
    post:
      tags: [Identité]
      summary: Débloquer la vérification d'un compte (administrateurs)
      description: Remet à zéro les refus et le délai d'attente.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/UserResponse' }
        '404': { $ref: '#/components/responses/Error' }

  /users/{id}/identity/attempts:
    get:
      tags: [Identité]
      summary: Historique des demandes d'un compte (administrateurs)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Demandes, les plus récentes d'abord
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        documentType: { type: string, enum: [CIN, LICENSE, PASSPORT] }
                        number: { type: string }
                        faceMatch: { type: [number, 'null'] }
                        checks: { type: [object, 'null'] }
                        outcome: { type: string, enum: [AUTO_VERIFIED, PENDING, VERIFIED, REJECTED] }
                        reason: { type: [string, 'null'] }
                        severe: { type: boolean }
                        createdAt: { type: string, format: date-time }
                        decidedAt: { type: [string, 'null'], format: date-time }
        '403': { $ref: '#/components/responses/Error' }

  /users:
    get:
      tags: [Administration]
      summary: Lister les comptes
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Nom, e-mail ou téléphone }
        - { name: role, in: query, schema: { $ref: '#/components/schemas/Role' } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: Page de comptes
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
                  total: { type: integer }
                  page: { type: integer }
                  pageSize: { type: integer }
        '403': { $ref: '#/components/responses/Error' }

  /users/agents:
    post:
      tags: [Administration]
      summary: Créer un compte agent rattaché à une compagnie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/RegisterInput'
                - type: object
                  required: [companyId]
                  properties:
                    companyId: { type: string, format: uuid }
      responses:
        '201': { $ref: '#/components/responses/UserResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Error' }

  /users/{id}/role:
    patch:
      tags: [Administration]
      summary: Attribuer un rôle
      description: Un agent doit avoir une compagnie. Impossible sur son propre compte (409).
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: '#/components/schemas/Role' }
                companyId: { type: string, format: uuid }
      responses:
        '200': { $ref: '#/components/responses/UserResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /users/{id}/status:
    patch:
      tags: [Administration]
      summary: Suspendre ou réactiver un compte
      description: La suspension ferme aussitôt les sessions et la connexion biométrique.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active]
              properties:
                active: { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/UserResponse' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /companies:
    get:
      tags: [Compagnies]
      summary: Lister les compagnies et leurs agences
      description: Ouvert à tout compte connecté (utile au module 2 pour les contrats).
      responses:
        '200':
          description: Compagnies
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Company' }
    post:
      tags: [Compagnies]
      summary: Créer une compagnie
      requestBody: { $ref: '#/components/requestBodies/CompanyInput' }
      responses:
        '201': { $ref: '#/components/responses/CompanyResponse' }
        '409': { $ref: '#/components/responses/Error' }

  /companies/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Compagnies]
      summary: Renommer une compagnie
      requestBody: { $ref: '#/components/requestBodies/CompanyInput' }
      responses:
        '200': { $ref: '#/components/responses/CompanyResponse' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Compagnies]
      summary: Supprimer une compagnie et ses agences
      description: Refusé (409 COMPANY_IN_USE) tant que des agents y sont rattachés.
      responses:
        '204': { description: Supprimée }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /companies/{id}/agencies:
    post:
      tags: [Compagnies]
      summary: Ajouter une agence
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { $ref: '#/components/requestBodies/AgencyInput' }
      responses:
        '201':
          description: Agence créée
          content:
            application/json:
              schema:
                type: object
                properties:
                  agency: { $ref: '#/components/schemas/Agency' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /companies/{id}/agencies/{agencyId}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
      - { name: agencyId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Compagnies]
      summary: Modifier une agence
      requestBody: { $ref: '#/components/requestBodies/AgencyInput' }
      responses:
        '200':
          description: Agence modifiée
          content:
            application/json:
              schema:
                type: object
                properties:
                  agency: { $ref: '#/components/schemas/Agency' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Compagnies]
      summary: Supprimer une agence
      responses:
        '204': { description: Supprimée }
        '404': { $ref: '#/components/responses/Error' }

  /constats:
    get:
      tags: [Constats]
      summary: Liste des constats signés
      description: |
        - Conducteur : liste ses constats signés
        - Agent : liste les constats impliquant sa compagnie (A ou B)
        - Administrateur : liste tous les constats
      responses:
        '200':
          description: Liste des constats
          content:
            application/json:
              schema:
                type: object
                properties:
                  constats:
                    type: array
                    items: { $ref: '#/components/schemas/Constat' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [Constats]
      summary: Sceller un constat amiable après double signature
      description: Reçoit les données du constat et le fichier PDF signé. Vérifie l'intégrité SHA-256 et transmet aux assureurs.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [pdf, data]
              properties:
                pdf:
                  type: string
                  format: binary
                  description: Document PDF généré et signé
                data:
                  type: string
                  description: Objet JSON contenant les données du constat (ConstatInput)
          application/json:
            schema:
              $ref: '#/components/schemas/ConstatInput'
      responses:
        '201':
          description: Constat scellé et enregistré
          content:
            application/json:
              schema:
                type: object
                properties:
                  constat: { $ref: '#/components/schemas/Constat' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /constats/{id}:
    get:
      tags: [Constats]
      summary: Détail d'un constat scellé
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Détail du constat
          content:
            application/json:
              schema:
                type: object
                properties:
                  constat: { $ref: '#/components/schemas/Constat' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /constats/{id}/pdf:
    get:
      tags: [Constats]
      summary: Télécharger l'exemplaire officiel scellé du PDF
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Document PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /constats/verify/{hash}:
    get:
      tags: [Constats]
      summary: Vérification publique d'intégrité par empreinte SHA-256
      security: []
      parameters:
        - name: hash
          in: path
          required: true
          description: Empreinte SHA-256 (64 caractères hexadécimaux)
          schema: { type: string }
      responses:
        '200':
          description: Constat authentique
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: { type: boolean, const: true }
                  constat:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      sha256Hash: { type: string }
                      place: { type: string }
                      occurredAt: { type: string, format: date-time }
                      driverAName: { type: string }
                      driverAPlate: { type: string }
                      driverAInsurer: { type: string }
                      driverBName: { type: string }
                      driverBPlate: { type: string }
                      driverBInsurer: { type: string }
                      createdAt: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

security:
  - bearer: []

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Side:
      name: side
      in: path
      required: true
      schema: { type: string, enum: [front, back] }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  requestBodies:
    Image:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [photo]
            properties:
              photo:
                type: string
                format: binary
                description: JPEG, PNG ou WebP, 5 Mo maximum
    CompanyInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name]
            properties:
              name: { type: string }
    AgencyInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, city]
            properties:
              name: { type: string }
              city: { type: string }

  responses:
    Session:
      description: Session ouverte
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Session' }
    UserResponse:
      description: Utilisateur
      content:
        application/json:
          schema:
            type: object
            properties:
              user: { $ref: '#/components/schemas/User' }
    CompanyResponse:
      description: Compagnie
      content:
        application/json:
          schema:
            type: object
            properties:
              company: { $ref: '#/components/schemas/Company' }
    Image:
      description: Image
      content:
        image/*:
          schema: { type: string, format: binary }
    Error:
      description: Erreur
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Données invalides (VALIDATION_ERROR), avec le détail par champ
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Role:
      type: string
      enum: [DRIVER, AGENT, ADMIN]
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string, format: email }
        phone: { type: string, examples: ['+21620123456'] }
        phoneVerified: { type: boolean }
        role: { $ref: '#/components/schemas/Role' }
        active: { type: boolean }
        language: { type: string, enum: [FR, AR, EN] }
        licenseNumber: { type: [string, 'null'] }
        licenseCategory: { type: [string, 'null'] }
        licenseIssuedAt: { type: [string, 'null'], format: date }
        company:
          oneOf:
            - type: 'null'
            - type: object
              properties:
                id: { type: string, format: uuid }
                name: { type: string }
        photoId:
          type: [string, 'null']
          description: Change à chaque nouvelle photo. Image servie par GET /users/{id}/photo.
        licensePhotoId:
          type: [string, 'null']
          description: Image servie par GET /users/{id}/license-photo.
        identity:
          type: object
          properties:
            status: { type: string, enum: [UNVERIFIED, PENDING, VERIFIED, REJECTED] }
            documentType: { type: string, enum: [CIN, LICENSE, PASSPORT] }
            cinNumber:
              type: [string, 'null']
              description: Numéro de la pièce présentée
            frontId: { type: [string, 'null'] }
            backId: { type: [string, 'null'] }
            selfieId:
              type: [string, 'null']
              description: Photo de face de la vérification du visage, effacée à la décision
            livenessAt: { type: [string, 'null'], format: date-time }
            faceMatch:
              type: [number, 'null']
              description: Ressemblance pièce / visage calculée par l'IA, de 0 à 1
            autoVerified:
              type: boolean
              description: Identité validée par l'IA, sans administrateur
            extracted:
              type: [object, 'null']
              description: >-
                Lu sur le recto par l'OCR : type, number ; CIN lastNameAr,
                firstNameAr, parentsAr, birthDate, birthPlaceAr ; passeport
                (MRZ) lastName, firstName, birthDate, expiresAt,
                numberCandidates. Un champ illisible vaut null.
            checks:
              type: [object, 'null']
              description: >-
                Contrôles à l'envoi (true, false ou null si non vérifiable) :
                numberRead, numberMatches, nameMatches, notExpired. L'IA ne
                valide seule que si le visage, le numéro et, pour un passeport,
                le nom et la validité concordent.
            submittedAt: { type: [string, 'null'], format: date-time }
            rejectionReason: { type: [string, 'null'] }
    DeviceSession:
      type: object
      properties:
        id: { type: string, format: uuid }
        deviceName: { type: [string, 'null'] }
        ip: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
        current: { type: boolean }
    LoginEvent:
      type: object
      properties:
        id: { type: string, format: uuid }
        success: { type: boolean }
        method: { type: string, enum: [password, biometric, register] }
        reason:
          type: [string, 'null']
          description: wrong_password, locked ou suspended pour un échec
        deviceName: { type: [string, 'null'] }
        ip: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    Session:
      type: object
      properties:
        user: { $ref: '#/components/schemas/User' }
        accessToken: { type: string, description: JWT valable 15 minutes }
        refreshToken: { type: string, description: Remplacé à chaque rafraîchissement }
    DeviceKey:
      type: object
      properties:
        deviceToken: { type: string }
        expiresAt: { type: string, format: date-time }
    RegisterInput:
      type: object
      required: [firstName, lastName, email, phone, password, consent]
      properties:
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string, format: email }
        phone: { type: string, description: 8 chiffres pour un numéro tunisien }
        password: { type: string, minLength: 8 }
        language: { type: string, enum: [FR, AR, EN], description: Facultatif, FR par défaut }
        consent:
          type: boolean
          const: true
          description: Consentement au traitement des données (loi n° 2004-63), obligatoire
    ProfileInput:
      type: object
      properties:
        firstName: { type: string }
        lastName: { type: string }
        phone: { type: string }
        language: { type: string, enum: [FR, AR, EN] }
        licenseNumber: { type: [string, 'null'] }
        licenseCategory: { type: [string, 'null'] }
        licenseIssuedAt: { type: [string, 'null'], format: date }
    RefreshInput:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    CodeInput:
      type: object
      required: [code]
      properties:
        code: { type: string, pattern: '^\d{6}$' }
    Company:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        createdAt: { type: string, format: date-time }
        agencies:
          type: array
          items: { $ref: '#/components/schemas/Agency' }
    Agency:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        city: { type: string }
        companyId: { type: string, format: uuid }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, examples: [VALIDATION_ERROR] }
            message: { type: string }
            fields:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  message: { type: string }
    Constat:
      type: object
      properties:
        id: { type: string, format: uuid }
        accidentId: { type: [string, 'null'], format: uuid }
        userId: { type: string, format: uuid }
        status: { type: string, enum: [SIGNED, TRANSMITTED, ARCHIVED] }
        sha256Hash: { type: string }
        pdfUrl: { type: string }
        driverAName: { type: string }
        driverAPlate: { type: string }
        driverAInsurer: { type: string }
        driverAPolicy: { type: [string, 'null'] }
        companyAId: { type: [string, 'null'], format: uuid }
        driverBName: { type: string }
        driverBEmail: { type: [string, 'null'], format: email }
        driverBPhone: { type: [string, 'null'] }
        driverBPlate: { type: string }
        driverBInsurer: { type: string }
        driverBPolicy: { type: [string, 'null'] }
        companyBId: { type: [string, 'null'], format: uuid }
        place: { type: string }
        occurredAt: { type: string, format: date-time }
        circumstancesA: { type: array, items: { type: string } }
        circumstancesB: { type: array, items: { type: string } }
        impactZones: { type: array, items: { type: string } }
        observations: { type: [string, 'null'] }
        driverASignedAt: { type: string, format: date-time }
        driverBSignedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ConstatInput:
      type: object
      required:
        - sha256Hash
        - driverAName
        - driverAPlate
        - driverAInsurer
        - driverBName
        - driverBPlate
        - driverBInsurer
        - place
        - occurredAt
      properties:
        accidentId: { type: string, format: uuid }
        sha256Hash: { type: string }
        pdfBase64: { type: string }
        driverAName: { type: string }
        driverAPlate: { type: string }
        driverAInsurer: { type: string }
        driverAPolicy: { type: string }
        companyAId: { type: string, format: uuid }
        driverBName: { type: string }
        driverBEmail: { type: string, format: email }
        driverBPhone: { type: string }
        driverBPlate: { type: string }
        driverBInsurer: { type: string }
        driverBPolicy: { type: string }
        companyBId: { type: string, format: uuid }
        place: { type: string }
        occurredAt: { type: string, format: date-time }
        circumstancesA: { type: array, items: { type: string } }
        circumstancesB: { type: array, items: { type: string } }
        impactZones: { type: array, items: { type: string } }
        observations: { type: string }
        driverASignedAt: { type: string, format: date-time }
        driverBSignedAt: { type: string, format: date-time }
